harbor:
  host: 10.42.10.197
  user: admin
  password: "Harbor@12345"

helm:
  version: "3.16.4"
  arch: "linux-amd64"
  url: "https://mirrors.huaweicloud.com/helm"

# ===== 应用列表：以后加新 app 只需追加一项 =====
apps:
  - name: pine-license              # helm release 名
    chart: pine-license             # harbor 里的 chart 名
    version: "1.0.42-dev.3"
    chart_project: charts           # ← 按 Harbor 真实项目名改（见下文第四节）
    namespace: default
    extra_set:                       # 每个应用可定制的 --set 参数
      - "ingress.enabled=false"
      - "persistence.enabled=false"

  - name: tsapi-service              # helm release 名
    chart: tsapi-service             # harbor 里的 chart 名
    version: "0.1.3-devcti.5"
    chart_project: charts           # ← 按 Harbor 真实项目名改（见下文第四节）
    namespace: default
    extra_set:                       # 每个应用可定制的 --set 参数
      - "ingress.enabled=false"
      - "persistence.enabled=false"
